[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-bench"
version = "0.1.0"
description = "Reproducible benchmark comparing retrieval pipelines on BEIR datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beir>=2.2.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "hatchling>=1.32.4",
    "matplotlib>=3.11.2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-bench = "rag_bench.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "rank-bm25>=0.2.2",
    "ranx>=0.3.21",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
